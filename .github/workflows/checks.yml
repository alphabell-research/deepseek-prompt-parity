name: Prompt parity checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: python parity.py --run-upstream-tests --report reports/parity.json
      - run: python parity.py --offline --run-upstream-tests
      - run: python generate_fixtures.py --offline --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python verify.py
